background {
    path = ~/.config/hypr/themes/blue/hypr/hyprlock/lock.png
    blur_size = 8
    brightness = 0.8
}
input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 3
    inner_color = rgba(255, 255, 255) #fill

    outer_color = rgba(33ccffee) rgba(00ff99ee) 45deg
    check_color=rgba(00ff99ee) rgba(ff6633ee) 120deg
    fail_color=rgba(ff6633ee) rgba(ff0066ee) 40deg

    font_color = rgb(0, 0, 0)
    fade_on_empty = true
    rounding = 50

    position = 0, -300
    halign = center
    valign = center
}
text {
    text = $TIME
    font_size = 28
    position = 0, 0
}

